<!doctype html>
<html lang="en">
<head><title>Checkout</title></head>
<body>
  <h1>Checkout</h1>
  <form action="/order" method="post">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required>
    <label for="plan">Plan</label>
    <select id="plan" name="plan" multiple>
      <option value="basic">Basic</option>
      <option value="pro" selected>Pro</option>
      <option value="team" disabled>Team</option>
    </select>
    <input id="tos" name="tos" type="checkbox" checked>
    <label for="coupon">Coupon</label>
    <input id="coupon" name="coupon" type="text" readonly value="SAVE10">
    <label for="zip">ZIP</label>
    <input id="zip" name="zip" type="text" pattern="[0-9]{5}">
    <label for="note">Note</label>
    <textarea id="note" name="note">Leave at door</textarea>
    <button type="submit">Pay now</button>
    <button type="button" disabled>Later</button>
  </form>
</body>
</html>
