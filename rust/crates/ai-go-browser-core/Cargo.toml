[package]
name = "ai-go-browser-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1"
ego-tree = "0.10"
encoding_rs = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "stream", "json"] }
scraper = "0.22"
tokio = { version = "1", features = ["net", "time", "rt", "macros"] }
url = "2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lib]
path = "src/lib.rs"

[lints]
workspace = true
