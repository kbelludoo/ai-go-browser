name: Empirical Independent Audit CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  audit-linux:
    name: Audit on Linux (Clean Environment)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Compile Pure Go Binaries (Zero CGO)
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go build -o bin/aigobrowser ./cmd/aigobrowser
          go build -o bin/wasmbench ./cmd/wasmbench
          go build -o bin/external_benchmarks ./cmd/external_benchmarks

      - name: Test 1: Run Integrated Autotest (-demo)
        run: |
          ./bin/aigobrowser -demo

      - name: Test 2: Live TLS Forensics & In-Process Benchmarks
        run: |
          ./bin/wasmbench

      - name: Test 3: WebArena & Mind2Web Real Task Evaluation
        run: |
          ./bin/external_benchmarks

      - name: Test 4: Run Core Unit Tests
        run: |
          go test -v ./browser ./pkg/benchmark ./pkg/memory

      - name: Upload Empirical Benchmark Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: empirical-audit-linux
          path: benchmark-results/

  audit-windows:
    name: Audit on Windows (Clean Environment)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Compile Pure Go Binaries
        run: |
          mkdir bin -ErrorAction SilentlyContinue
          go build -o bin/aigobrowser.exe ./cmd/aigobrowser
          go build -o bin/wasmbench.exe ./cmd/wasmbench
          go build -o bin/external_benchmarks.exe ./cmd/external_benchmarks

      - name: Test 1: Run Integrated Autotest (-demo)
        run: |
          .\bin\aigobrowser.exe -demo

      - name: Test 2: Live TLS Forensics & In-Process Benchmarks
        run: |
          .\bin\wasmbench.exe

      - name: Test 3: WebArena & Mind2Web Real Task Evaluation
        run: |
          .\bin\external_benchmarks.exe

      - name: Test 4: Run Core Unit Tests
        run: |
          go test -v ./browser ./pkg/benchmark ./pkg/memory

      - name: Upload Empirical Benchmark Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: empirical-audit-windows
          path: benchmark-results/
