name: Go versus Odin static benchmark
on:
  workflow_dispatch:
  push:
    paths:
      - 'odin/**'
      - '.github/workflows/odin-compare.yml'
      - 'browser/parser.go'
      - 'browser/cso.go'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    paths:
      - 'odin/**'
      - '.github/workflows/odin-compare.yml'
      - 'browser/parser.go'
      - 'browser/cso.go'
      - 'go.mod'
      - 'go.sum'

jobs:
  same-runner-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Odin native dependency
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev
      - name: Build both native executables
        run: |
          go version
          odin version
          go build -trimpath -o go-browser-reference ./odin/bench/go_reference.go
          odin build odin -out:ai-odin-browser -o:speed
          ls -lh ./go-browser-reference ./ai-odin-browser
      - name: Generate same-input fixture
        run: python3 odin/bench/generate_fixture.py
      - name: Compare page semantics, timing and peak RSS
        run: |
          python3 odin/bench/compare.py --fixture odin/bench/fixture_generated.html --url https://example.com/catalog --iterations 300 --reps 5 --out odin/bench/results.json
      - name: Compare small fixture and record parity
        run: |
          python3 odin/bench/compare.py --fixture odin/fixtures/index.html --url https://example.com/index.html --iterations 1500 --reps 5 --out odin/bench/results-small.json
      - name: Benchmark real same-host HTTP browser sessions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 18767 --bind 127.0.0.1 --directory odin/bench >/tmp/compare-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          sleep 1
          python3 odin/bench/live_compare.py
      - name: Check Go and Odin token heuristics against same text
        run: |
          go_token=$(./go-browser-reference tokens odin/fixtures/index.html placeholder)
          odin_token=$(./ai-odin-browser tokens odin/fixtures/index.html)
          echo "Go tokens=$go_token Odin tokens=$odin_token"
          test "$go_token" = "$odin_token"
      - name: Check static CSS selector query parity
        run: |
          ./go-browser-reference query-file odin/bench/fixture_generated.html https://example.com/catalog "main a" > /tmp/go-query.json
          ./ai-odin-browser query-file odin/bench/fixture_generated.html https://example.com/catalog "main a" > /tmp/odin-query.json
          python3 -c "import json; g=json.load(open('/tmp/go-query.json')); o=json.load(open('/tmp/odin-query.json')); assert g['ok'] and o['ok'], f'Queries failed: Go={g} Odin={o}'; assert len(g['matches']) == len(o['matches']) == 32, f'Count mismatch: Go={len(g[\"matches\"])} Odin={len(o[\"matches\"])}'; print(f'Selector parity PASS: matches={len(g[\"matches\"])}')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-odin-static-comparison
          path: |
            odin/bench/results.json
            odin/bench/results-small.json
            odin/bench/live-results.json
          if-no-files-found: warn
